# EventLens — nginx site config.
# Install:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/eventlens
#           sudo cp deploy/security-headers.conf /etc/nginx/snippets/eventlens-security-headers.conf
#           sudo ln -s /etc/nginx/sites-available/eventlens /etc/nginx/sites-enabled/
#           (replace photos.example.com everywhere) && sudo nginx -t && sudo systemctl reload nginx
# HTTPS:    obtain the certificate FIRST: sudo certbot certonly --nginx -d photos.example.com
#
# Paths:    frontend build -> /var/www/eventlens   (contents of frontend/dist)
#           photos         -> /srv/eventlens/photos (PHOTOS_DIR)
#           API            -> 127.0.0.1:8000

server {
    listen 80;
    listen [::]:80;
    server_name photos.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` works on Ubuntu's nginx 1.18/1.24 (newer nginx prefers `http2 on;`).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name photos.example.com;

    # Created by `sudo certbot certonly --nginx -d photos.example.com` (see README).
    ssl_certificate     /etc/letsencrypt/live/photos.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photos.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/eventlens;
    index index.html;

    # --- Compression ----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # Default body limit for everything else.
    client_max_body_size 1m;

    include /etc/nginx/snippets/eventlens-security-headers.conf;

    # --- Proxy defaults -------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite (not append) so clients can't spoof their IP for rate limiting.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Selfie matching: keep request bodies IN MEMORY ----------------------
    # A body buffer as large as the max request means nginx never writes the
    # selfies to its temp directory on disk.
    location = /api/match {
        client_max_body_size 26m;
        client_body_buffer_size 26m;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:8000;
    }

    # --- Admin API: large multi-file photo / video uploads (videos up to 500 MB)
    location /api/admin/ {
        client_max_body_size 520m;
        # Stream uploads straight to the backend instead of buffering them.
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_pass http://127.0.0.1:8000;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
    }

    # --- Photos (resized JPEGs) -------------------------------------------------
    # Staged uploads and kept originals are never served publicly.
    location ^~ /photos/_incoming/ {
        return 404;
    }
    location ~ ^/photos/[^/]+/original/ {
        return 404;
    }
    location /photos/ {
        alias /srv/eventlens/photos/;
        # File names are UUIDs and never change -> cache aggressively.
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /etc/nginx/snippets/eventlens-security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # --- Frontend (Vite build) ------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/eventlens-security-headers.conf;
        try_files $uri =404;
    }

    location / {
        # SPA fallback; index.html must not be cached so new deploys apply immediately.
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/eventlens-security-headers.conf;
    }
}
